# The engine is exempt from the publish-age cooldown.
#
# pnpm will not install anything published in the last day — a good
# rule, and malware is usually found inside it. It is the wrong rule
# for these, which are Gesso's own packages, released from the checkout
# beside this one so an engine fix can reach this app the day it is
# made. The exemption is by name and only these names.
minimumReleaseAgeExclude:
  - gesso-components
  - gesso-core
  - gesso-devtools
  - gesso-framework
  - gesso-testing
  - gesso-vite-plugin
